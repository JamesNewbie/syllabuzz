<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cryptography · Syllabuzz 學蜂</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/app.js" defer></script>
</head>
<body data-course="cryptography">

<header class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="assets/logo.svg" width="34" height="34" alt="">Syllabuzz <small lang="zh-Hant">學蜂</small></a>
    <nav class="links" aria-label="Main">
      <a href="index.html#courses" data-i18n="navCourses">Courses</a>
      <a href="index.html#about" data-i18n="navAbout">About</a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="zh" aria-pressed="false">中文</button>
      </div>
    </nav>
  </div>
</header>

<main class="wrap">
  <p class="crumb"><a href="index.html" data-i18n="home">Home</a> / <span id="crumb-title">Cryptography</span></p>
  <div class="course-head">
    <h1 id="course-title">Cryptography</h1>
    <p data-i18n="courseIntro"></p>
  </div>

  <div class="player-layout">
    <div class="player">
      <video id="player" controls preload="metadata" playsinline></video>
      <div class="now">
        <span class="tag" id="now-label" style="display:inline-block;margin-top:20px">Chapter 1</span>
        <h2 id="now-title"></h2>
        <ul class="topics" id="topics"></ul>
      </div>
      <div class="pager">
        <button type="button" id="prev" data-i18n="prev">← Previous</button>
        <button type="button" id="next" data-i18n="next">Next →</button>
      </div>

      <section class="notes" aria-labelledby="notes-title">
        <div class="notes-head">
          <h3 id="notes-title" data-i18n="notesTitle">My notes</h3>
          <button type="button" id="export" class="link-btn" data-i18n="export">Export all notes</button>
        </div>
        <p class="hint" data-i18n="notesHint">Notes are saved in this browser only.</p>

        <form id="mark-form" class="mark-form">
          <label for="mark-note" data-i18n="markLabel">Mark this moment</label>
          <div class="mark-row">
            <span class="time-pill" id="mark-time">0:00</span>
            <input id="mark-note" type="text" autocomplete="off" data-i18n-ph="markPh" placeholder="What happens here? (optional)">
            <button type="submit" class="btn-mark" data-i18n="addMark">Add mark</button>
          </div>
        </form>
        <ol id="marks" class="marks"></ol>
        <p id="marks-empty" class="hint" data-i18n="noMarks">No marks yet.</p>

        <label for="note-text" class="note-label" data-i18n="noteLabel">Chapter notes</label>
        <textarea id="note-text" rows="6" data-i18n-ph="notePh" placeholder="Write your notes for this chapter..."></textarea>
        <p id="saved" class="hint" aria-live="polite"></p>
      </section>
    </div>
    <aside class="playlist" aria-label="Chapters">
      <h3 data-i18n="chapters">Chapters</h3>
      <ol id="playlist"></ol>
    </aside>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year">2026</span> Syllabuzz 學蜂</span>
    <nav aria-label="Footer"><a href="index.html#courses" data-i18n="navCourses">Courses</a><a href="index.html#about" data-i18n="navAbout">About</a></nav>
  </div>
</footer>
</body>
</html>
